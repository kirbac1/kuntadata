name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      # No Azure secrets here on purpose: the assistant falls back to its
      # offline responder, so the suite runs on a fork's PR too.
      - name: Test
        run: uv run pytest --cov=kuntadata --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t kuntadata:ci .

      - name: Container answers its health check
        run: |
          docker run -d --name kuntadata -p 8000:8000 kuntadata:ci
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 000)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs kuntadata
          exit 1
